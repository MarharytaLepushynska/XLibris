<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — XLibris</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">
<div class="app-layout">
    <main class="main-content">
        <div class="login-container">
            <div class="bookmark" aria-hidden="true"></div>

            <div class="login-header">
                <span class="logo-text">XLibris</span>
                <h1 class="login-title">З поверненням</h1>
            </div>

            <div th:if="${param.error}" class="alert alert-error">
                Неправильний email або пароль.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                Ви успішно вийшли із системи.
            </div>

            <form th:action="@{/login}" method="post" class="login-form">
                <div class="form-group">
                    <label for="username">Email:</label>
                    <input type="text" id="username" name="username" required
                           placeholder="For example: user@xlibris.com">
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••">
                </div>

                <button type="submit" class="button">Увійти</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
