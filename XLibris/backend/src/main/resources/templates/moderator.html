
<!DOCTYPE html>
<html lang="uk" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>XLibris — Moderator</title>
</head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-content">
        <h1>Ви зайшли на сторінку модератора!</h1>

        <div sec:authorize="hasRole('MODERATOR')">
            <p>Вам доступні функції модератора.</p>
        </div>

        <div sec:authorize="hasRole('ADMIN')">
            <p>Вам доступні функції адміністратора.</p>
        </div>
    </main>
</div>
</body>
</html>
