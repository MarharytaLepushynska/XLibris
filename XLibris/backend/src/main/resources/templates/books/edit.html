
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit book — XLibris</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/book-form.css}">
</head>

<body>
<div class="app-layout">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">

        <div class="page-heading">
            <header th:replace="~{fragments/layout :: greeting}"></header>
        </div>

        <h2 class="section-title">Edit book</h2>

        <section class="edit-form-card">

            <form th:action="@{/books/{id}/edit(id=${bookId})}"
                  th:object="${form}"
                  method="post">

                <!-- Book title -->
                <div class="form-group">
                    <label for="title">Title *</label>

                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           maxlength="100"
                           required>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}">
                    </p>
                </div>

                <!-- Book description -->
                <div class="form-group">
                    <label for="description">Description *</label>

                    <textarea id="description"
                              th:field="*{description}"
                              maxlength="2000"
                              rows="5"
                              required></textarea>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}">
                    </p>
                </div>

                <!-- Cover URL -->
                <div class="form-group">
                    <label for="photoURL">Cover photo URL</label>

                    <input type="url"
                           id="photoURL"
                           th:field="*{photoURL}"
                           placeholder="https://example.com/book.jpg">
                </div>

                <!-- Author -->
                <div class="form-group">
                    <label for="authorId">Author</label>

                    <select id="authorId" th:field="*{authorId}">
                        <option value="">Select author</option>

                        <option th:each="author : ${authors}"
                                th:value="${author.id}"
                                th:text="${author.name}">
                        </option>
                    </select>
                </div>

                <!-- Genre -->
                <div class="form-group">
                    <label for="genreId">Genre *</label>

                    <select id="genreId"
                            th:field="*{genreId}"
                            required>

                        <option value="">Select genre</option>

                        <option th:each="genre : ${genres}"
                                th:value="${genre.id}"
                                th:text="${genre.name}">
                        </option>
                    </select>

                    <p class="field-error"
                       th:if="${#fields.hasErrors('genreId')}"
                       th:errors="*{genreId}">
                    </p>
                </div>

                <!-- Form buttons -->
                <div class="form-actions">

                    <a th:href="@{/books}"
                       class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit"
                            class="save-button">
                        Save changes
                    </button>

                </div>

            </form>
        </section>

    </main>
</div>
</body>
</html>
